name: Build Islamic station list

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "tools/build_islamic.py"
      - "tools/find_streams.py"
      - "tools/candidates.json"
      - ".github/workflows/islamic.yml"

permissions:
  contents: write

concurrency:
  group: islamic-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the list
        run: python3 tools/build_islamic.py
      - name: Look for streams of stations the directory lacks
        if: github.event_name != 'schedule'
        continue-on-error: true
        timeout-minutes: 8
        run: python3 tools/find_streams.py
      - name: Save the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Islamic station list"
          git pull --rebase origin main
          git push origin HEAD:main
